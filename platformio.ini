; Reproducible UART isolation stages for the existing ESP32 DevKit wiring.
; Depends on Espressif32 8.0.0 (Arduino 3.3.12); no external DMX library.
[platformio]
default_envs = esp32dev

[env]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; USB enumeration can change ttyUSB numbers after reconnecting the board.
upload_port = /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0
monitor_port = ${env.upload_port}
upload_speed = 115200
monitor_dtr = 0
monitor_rts = 0

[env:serial_only]
build_flags = -D CABEK_DMX_STAGE=0

[env:dmx_init]
build_flags = -D CABEK_DMX_STAGE=1

[env:esp32dev]
build_flags = -D CABEK_DMX_STAGE=2

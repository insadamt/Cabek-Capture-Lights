; Reproducible UART isolation stages for the existing ESP32 DevKit wiring.
; Depends on Espressif32 8.0.0 (Arduino 3.3.12); no external DMX library.
[platformio]
default_envs = esp32dev

[env]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
upload_speed = 115200
monitor_dtr = 0
monitor_rts = 0

[env:serial_only]
build_flags = -D CABEK_DMX_STAGE=0

[env:dmx_init]
build_flags = -D CABEK_DMX_STAGE=1

[env:esp32dev]
build_flags = -D CABEK_DMX_STAGE=2
